<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JK888 — คลังทะเบียนส่งออก</title><link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:#fbf2e2;--card:#fff;--ink:#4a3826;--soft:#93805f;--line:#e2d5bd;--red:#c94f4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,sans-serif}.wrap{max-width:1050px;margin:auto;padding:34px 24px}.back{color:var(--soft);text-decoration:none;font-weight:600}.back:hover{color:var(--red)}h1{font:700 28px Mitr,sans-serif;margin:14px 0 3px}.sub{color:var(--soft);margin:0 0 24px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:14px}.name{font:600 18px Mitr,sans-serif;margin:0}.meta{color:var(--soft);font-size:14px;margin:4px 0 0}.btn{border:0;border-radius:999px;background:var(--red);color:white;padding:12px 18px;font:600 14px Mitr,sans-serif;cursor:pointer;white-space:nowrap}.empty{background:#fff;border:1px dashed var(--line);border-radius:20px;padding:42px;text-align:center;color:var(--soft)}@media(max-width:560px){.card{align-items:flex-start;flex-direction:column}.wrap{padding:22px 16px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="claims-auth.js?v=20260921-cloud"></script><script defer src="claims-data.js?v=20261009-monthly"></script></head><body><main class="wrap"><a class="back" href="pi-archive.html">← กลับไปหน้า Archive</a><h1>🚚 ทะเบียนพัสดุส่งออก</h1><p class="sub">ประวัติส่งออกเก็บครบ แยกดูและดาวน์โหลดตามเดือน ไม่ถูกลบเมื่อปิดรอบ</p><label for="archiveMonth">เลือกเดือนย้อนหลัง</label><select id="archiveMonth" style="padding:10px;margin:10px 8px 16px 0;font:inherit;"></select><button class="btn" id="downloadOutboundMonth">ดาวน์โหลดทั้งเดือน</button><p class="sub" id="archiveMonthNote"></p><div id="list"></div></main><script type="text/plain" data-cloud-page>
window.renderCloudPage=function(){
 var all=ClaimsDB.read('pi_outbound_batches'), select=document.getElementById('archiveMonth'), previous=select.value;
 var months=Array.from(new Set(all.map(function(x){return (x.date||'').slice(0,7);}).filter(Boolean))).sort().reverse();
 var closed=new Set(ClaimsDB.read('pi_returns_archive').map(function(x){return x.month;}));
 select.replaceChildren();months.forEach(function(m){var option=document.createElement('option');option.value=m;option.textContent=m+(closed.has(m)?' — ปิดรอบแล้ว':'');select.append(option);});
 if(months.includes(previous))select.value=previous;
 var rows=all.filter(function(x){return (x.date||'').slice(0,7)===select.value;}), groups={};
 rows.forEach(function(x){(groups[x.date]||(groups[x.date]=[])).push(x);});
 var dates=Object.keys(groups).sort().reverse();
 function dl(items,name){
  function csv(v){return '"'+String(v||'').replace(/"/g,'""')+'"';}
  var txt='เลขพัสดุ,วันที่ส่งออก,ไฟล์ต้นทาง\n'+items.map(function(x){return [x.tracking,x.date,x.source].map(csv).join(',');}).join('\n');
  var url=URL.createObjectURL(new Blob(['\uFEFF'+txt],{type:'text/csv;charset=utf-8'})), link=document.createElement('a');link.href=url;link.download='ส่งออก_'+name+'.csv';link.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);
 }
 document.getElementById('archiveMonthNote').textContent=rows.length?'เดือน '+select.value+' · '+rows.length.toLocaleString()+' เลข · '+dates.length+' วัน':'ยังไม่มีทะเบียนส่งออก';
 document.getElementById('list').replaceChildren();
 dates.forEach(function(d){
  var card=document.createElement('section');card.className='card';
  var text=document.createElement('div'),title=document.createElement('p'),count=document.createElement('p');title.className='name';title.textContent=d;count.className='meta';count.textContent=groups[d].length.toLocaleString()+' เลขพัสดุ';text.append(title,count);
  var button=document.createElement('button');button.className='btn';button.textContent='ดาวน์โหลดรายวัน';button.onclick=function(){dl(groups[d],d);};
  card.append(text,button);document.getElementById('list').append(card);
 });
 select.onchange=window.renderCloudPage;
 var download=document.getElementById('downloadOutboundMonth');download.disabled=!rows.length;download.onclick=function(){dl(rows,select.value);};
};
window.renderCloudPage();
</script></body></html>
