<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JK888 — คลังทะเบียนส่งออก</title><link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:#fbf2e2;--card:#fff;--ink:#4a3826;--soft:#93805f;--line:#e2d5bd;--red:#c94f4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,sans-serif}.wrap{max-width:1050px;margin:auto;padding:34px 24px}.back{color:var(--soft);text-decoration:none;font-weight:600}.back:hover{color:var(--red)}h1{font:700 28px Mitr,sans-serif;margin:14px 0 3px}.sub{color:var(--soft);margin:0 0 24px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:14px}.name{font:600 18px Mitr,sans-serif;margin:0}.meta{color:var(--soft);font-size:14px;margin:4px 0 0}.btn{border:0;border-radius:999px;background:var(--red);color:white;padding:12px 18px;font:600 14px Mitr,sans-serif;cursor:pointer;white-space:nowrap}.empty{background:#fff;border:1px dashed var(--line);border-radius:20px;padding:42px;text-align:center;color:var(--soft)}@media(max-width:560px){.card{align-items:flex-start;flex-direction:column}.wrap{padding:22px 16px}}</style></head><body><main class="wrap"><a class="back" href="pi-archive.html">← กลับไปหน้า Archive</a><h1>🚚 ทะเบียนพัสดุส่งออก</h1><p class="sub">จัดกลุ่มตามวันส่งออกจากไฟล์ JST ที่อัปโหลดไว้</p><div id="list"></div></main><script>var all=[];try{all=JSON.parse(localStorage.getItem('pi_outbound_batches')||'[]')}catch(e){}var groups={};all.forEach(function(x){if(x.date)(groups[x.date]||(groups[x.date]=[])).push(x)});var dates=Object.keys(groups).sort().reverse();function dl(rows,d){var a=document.createElement('a'),txt='เลขพัสดุ,วันที่ส่งออก,ไฟล์ต้นทาง\n'+rows.map(function(x){return [x.tracking,x.date,'"'+String(x.source||'').replace(/"/g,'""')+'"'].join(',')}).join('\n');a.href=URL.createObjectURL(new Blob(['\uFEFF'+txt],{type:'text/csv;charset=utf-8'}));a.download='ส่งออก_'+d+'.csv';a.click();URL.revokeObjectURL(a.href)}document.getElementById('list').innerHTML=dates.length?dates.map(function(d){return '<section class="card"><div><p class="name">'+d+'</p><p class="meta">'+groups[d].length+' เลขพัสดุ</p></div><button class="btn" data-day="'+d+'">ดาวน์โหลด CSV</button></section>'}).join(''):'<div class="empty">ยังไม่มีทะเบียนส่งออก — อัปโหลดไฟล์ในหน้า Enter data ก่อน</div>';document.querySelectorAll('[data-day]').forEach(function(b){b.onclick=function(){dl(groups[b.dataset.day],b.dataset.day)}});</script></body></html>
