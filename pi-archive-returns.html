<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JK888 — คลังข้อมูลตีกลับ</title><link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:#fbf2e2;--card:#fff;--ink:#4a3826;--soft:#93805f;--line:#e2d5bd;--red:#c94f4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,sans-serif}.wrap{max-width:1050px;margin:auto;padding:34px 24px}.back{color:var(--soft);text-decoration:none;font-weight:600}.back:hover{color:var(--red)}h1{font:700 28px Mitr,sans-serif;margin:14px 0 3px}p{margin:0}.sub{color:var(--soft);margin-bottom:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:14px}.name{font:600 18px Mitr,sans-serif}.meta{color:var(--soft);font-size:14px;margin-top:4px}.btn{border:0;border-radius:999px;background:var(--red);color:white;padding:12px 18px;font:600 14px Mitr,sans-serif;cursor:pointer;white-space:nowrap}.empty{background:#fff;border:1px dashed var(--line);border-radius:20px;padding:42px;text-align:center;color:var(--soft)}@media(max-width:560px){.card{align-items:flex-start;flex-direction:column}.wrap{padding:22px 16px}}</style></head><body><main class="wrap"><a class="back" href="pi-archive.html">← กลับไปหน้า Archive</a><h1>↩️ ข้อมูลตีกลับ</h1><p class="sub">เฉพาะรายการตีกลับที่ปิดรอบเดือนแล้ว</p><div id="list"></div></main><script>var months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];function label(m){var p=m.split('-');return months[+p[1]-1]+' '+(+p[0]+543)}function dl(rows,m){var h='เลขพัสดุ,เลขออเดอร์,ชื่อสินค้า,จำนวน,วันที่ตีกลับ\n';var l=rows.map(function(r){return [r.tracking,r.order||'','"'+String(r.product||'').replace(/"/g,'""')+'"',r.qty,r.date].join(',')});var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+h+l.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='ตีกลับ_'+m+'.csv';a.click();URL.revokeObjectURL(a.href)}var data=[];try{data=JSON.parse(localStorage.getItem('pi_returns_archive')||'[]')}catch(e){}data.sort(function(a,b){return b.month.localeCompare(a.month)});document.getElementById('list').innerHTML=data.length?data.map(function(x,i){return '<section class="card"><div><p class="name">'+label(x.month)+'</p><p class="meta">'+x.rows.length+' รายการ · เก็บเมื่อ '+new Date(x.archivedAt).toLocaleString('th-TH')+'</p></div><button class="btn" data-i="'+i+'">ดาวน์โหลด CSV</button></section>'}).join(''):'<div class="empty">ยังไม่มีข้อมูลตีกลับที่ปิดรอบ</div>';document.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){var x=data[+b.dataset.i];dl(x.rows,x.month)}});</script></body></html>
