<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%A6</text></svg>">
<title>JK888 Return & Claims — Return</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="claims-auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#FBF2E2; --surface:#FFFFFF; --surface-kraft:#F3E4C8;
    --ink:#4A3826; --ink-soft:#93805F; --ink-faint:#C9B594;
    --border:rgba(74,56,38,0.15);
    --stamp-red:#C94F4F; --stamp-red-deep:#A83A3A; --stamp-red-soft:#F3DEDE; --on-stamp:#FFFFFF;
    --stamp-green:#5FA980; --stamp-green-soft:#DCEEE2; --stamp-green-deep:#3F7D5C;
    --radius-lg:22px; --radius-md:16px; --radius-pill:999px;
    --font-display:'Mitr',sans-serif; --font-body:'Sarabun',sans-serif; --font-mono:'JetBrains Mono',monospace;
    --text-danger:var(--stamp-red-deep); --text-muted:var(--ink-faint);
    --bg-success:var(--stamp-green-soft); --border-success:var(--stamp-green); --text-success:var(--stamp-green-deep);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#241C13; --surface:#332619; --surface-kraft:#3E2F1E;
      --ink:#F6EBDB; --ink-soft:#CBB693; --ink-faint:#8D7856;
      --border:rgba(246,235,219,0.14);
      --stamp-red:#E27878; --stamp-red-deep:#F0A0A0; --stamp-red-soft:#4A2C2C; --on-stamp:#2A1010;
      --stamp-green:#7FC29E; --stamp-green-soft:#25392E; --stamp-green-deep:#9FDABB;
    }
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; -webkit-font-smoothing:antialiased; }
  .disp{font-family:var(--font-display);}
  .mono{font-family:var(--font-mono);}
  input,select{ height:46px; border-radius:var(--radius-md); border:1.5px solid var(--border); background:var(--surface); color:var(--ink); padding:0 14px; font-size:15px; font-family:inherit; width:100%; }
  button{font-family:inherit; cursor:pointer;}
  label{font-size:14px; font-weight:600; color:var(--ink-soft); display:block; margin:0 0 6px;}

  .shell{display:flex; min-height:100vh;}
  .sidebar{width:220px; flex-shrink:0; background:var(--surface-kraft); padding:24px 16px; border-right:1.5px solid var(--border);}
  @media (max-width:768px){ .shell{flex-direction:column;} .sidebar{width:100%; display:flex; align-items:center; gap:14px; padding:14px 18px; border-right:none; border-bottom:1.5px solid var(--border);} .sidebar .navlist{display:flex; flex-direction:row; gap:6px; overflow-x:auto;} .sidebar .navlabel{white-space:nowrap;} }

  .brand{display:flex; align-items:center; gap:10px; margin-bottom:24px; text-decoration:none; color:inherit; position:relative;}
  @media (max-width:768px){ .brand{margin-bottom:0;} }
  .brand-stamp{position:absolute; top:-18px; left:-14px; width:46px; height:46px; border-radius:50%; border:2.5px solid var(--stamp-red); opacity:0.85; transform:rotate(-12deg); display:flex; align-items:center; justify-content:center;}
  .brand-stamp::after{content:'↩'; font-size:20px; font-weight:700; color:var(--stamp-red);}
  @media (max-width:768px){ .brand-stamp{display:none;} }
  .brand-icon{font-size:26px; line-height:1; position:relative; z-index:1;}
  .brand-name{font-family:var(--font-display); font-size:14.5px; font-weight:700; margin:0; line-height:1.3; position:relative; z-index:1;}

  .navlist{display:flex; flex-direction:column; gap:5px;}
  .navitem{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--radius-md); text-decoration:none; color:var(--ink-soft); font-family:var(--font-display); font-size:15px; font-weight:500; white-space:nowrap;}
  .navitem .navicon{font-size:18px;}
  .navitem.active{background:var(--stamp-red); color:var(--on-stamp);}

  .main{flex:1; padding:28px 30px; min-width:0;}
  @media (max-width:768px){ .main{padding:18px;} }
  .pagetitle{font-family:var(--font-display); font-size:26px; font-weight:700; margin:0 0 4px;}
  .pagesub{font-size:15px; color:var(--ink-soft); margin:0 0 24px;}

  .card{background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:22px; margin-bottom:18px;}
  .section-label{font-family:var(--font-display); font-size:17px; font-weight:600; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .hint{font-size:13.5px; color:var(--ink-soft); margin:0 0 12px; line-height:1.5;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:640px){ .row2, .row3{grid-template-columns:1fr;} }

  .file-btn{background:var(--surface-kraft); border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:0 16px; font-size:15px; font-weight:500; color:var(--ink-soft); display:flex; align-items:center; gap:8px; cursor:pointer; justify-content:center; height:46px;}
  input[type=file]{display:none;}

  .btn-main{background:var(--stamp-red); color:var(--on-stamp); border:none; border-radius:var(--radius-pill); height:48px; padding:0 24px; font-family:var(--font-display); font-size:15.5px; font-weight:600; width:auto; box-shadow:0 4px 14px rgba(201,79,79,0.28);}
  .btn-dark{background:var(--ink); color:var(--surface); border:none; border-radius:var(--radius-pill); height:48px; padding:0 24px; font-family:var(--font-display); font-size:15.5px; font-weight:600; width:auto;}
  .btn-ghost{border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:var(--radius-pill); height:40px; padding:0 16px; font-size:13.5px; font-weight:500; width:auto;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:12px; margin-bottom:18px;}
  .kpi-card{border-radius:var(--radius-lg); padding:18px; background:var(--surface-kraft);}
  .kpi-label{font-size:13px; color:var(--ink-soft); font-weight:600; margin:0 0 6px;}
  .kpi-num{font-family:var(--font-display); font-size:26px; font-weight:700; margin:0; color:var(--ink);}

  table{width:100%; border-collapse:collapse; font-size:14.5px;}
  th{text-align:left; padding:9px 8px; color:var(--ink-soft); font-weight:600; border-bottom:1.5px solid var(--border); white-space:nowrap; font-size:12.5px;}
  td{padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  .empty{text-align:center; padding:30px 20px; color:var(--ink-faint); font-size:14.5px;}
  .toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;}

  .month-card{background:var(--stamp-red-soft); border:1.5px solid var(--stamp-red); border-radius:var(--radius-lg); padding:22px;}
  .month-card .section-label{color:var(--stamp-red-deep);}
  .danger-card{background:var(--stamp-red-soft); border:none;}
  .danger-card .section-label{color:var(--stamp-red-deep);}
  .seg-control{display:inline-flex; background:var(--surface-kraft); border-radius:var(--radius-pill); padding:4px; gap:4px;}
  .seg-btn{font-family:var(--font-display); font-size:14.5px; font-weight:600; padding:9px 20px; border-radius:var(--radius-pill); border:none; background:transparent; color:var(--ink-soft);}
  .seg-btn.active{background:var(--stamp-red); color:var(--on-stamp);}

  .order-hero{background:var(--stamp-red-soft); border-radius:var(--radius-lg); padding:24px; margin-bottom:18px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .order-hero-icon{font-size:34px;}
  .order-hero-label{font-size:14px; color:var(--stamp-red-deep); font-weight:600; margin:0 0 4px;}
  .order-hero-num{font-family:var(--font-display); font-size:40px; font-weight:700; margin:0; color:var(--stamp-red-deep);}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="pi-report.html"><div class="brand-stamp"></div><div class="brand-icon">📦</div><p class="brand-name">JK888<br>Return &amp; Claims</p></a>
    <nav class="navlist">
      <a class="navitem" href="pi-report.html"><span class="navicon">📊</span><span class="navlabel">Report</span></a>
      <a class="navitem active" href="pi-returns.html"><span class="navicon">↩️</span><span class="navlabel">Return</span></a>
      <a class="navitem" href="pi-claims.html"><span class="navicon">🧾</span><span class="navlabel">Claims</span></a>
      <a class="navitem" href="pi-enter-data.html"><span class="navicon">✏️</span><span class="navlabel">Enter data</span></a>
      <a class="navitem" href="pi-tracking.html"><span class="navicon">🔎</span><span class="navlabel">Tracking</span></a>
      <a class="navitem" href="pi-archive.html"><span class="navicon">🗂️</span><span class="navlabel">Archive</span></a>
    </nav>
  </aside>

  <main class="main">
    <p class="pagetitle">Return</p>
    <p class="pagesub">รายละเอียดพัสดุตีกลับ — ดูรายวันหรือรายเดือนก็ได้</p>

    <div class="seg-control" style="margin-bottom:16px;">
      <button class="seg-btn active" id="segDay">รายวัน</button>
      <button class="seg-btn" id="segMonth">รายเดือน</button>
    </div>

    <div class="row2" style="margin-bottom:18px; max-width:460px;">
      <div id="dayField"><label>เลือกวันที่</label><input type="date" id="viewDayInput"></div>
      <div id="monthField" style="display:none;"><label>เลือกเดือน</label><input type="month" id="viewMonthInput"></div>
    </div>

    <div class="order-hero">
      <div class="order-hero-icon">📋</div>
      <div>
        <p class="order-hero-label" id="orderHeroLabel">จำนวนออเดอร์ที่ตีกลับ — วันนี้</p>
        <p class="order-hero-num disp" id="orderHeroNum">0</p>
      </div>
    </div>

    <div class="card" style="padding:0; overflow-x:auto;">
      <p class="section-label" style="padding:22px 22px 0;">📦 สินค้าที่ตีกลับ ในช่วงที่เลือก</p>
      <table>
        <thead><tr><th>ชื่อสินค้า</th><th>จำนวนชิ้น</th><th>จำนวนออเดอร์</th></tr></thead>
        <tbody id="summaryBody"></tbody>
      </table>
      <div class="empty" id="summaryEmpty">ไม่มีข้อมูลในช่วงที่เลือก</div>
    </div>
  </main>
</div>

<script>
function showToast(msg, warn){
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:'+(warn?'var(--stamp-red-deep)':'var(--ink)')+'; color:var(--surface); padding:13px 22px; border-radius:999px; font-size:14.5px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,0.25);';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2400);
}
function getReturnsData(){
  try{ return JSON.parse(localStorage.getItem('pi_returns_data') || '[]'); } catch(e){ return []; }
}

var viewMode = 'day';
document.getElementById('segDay').addEventListener('click', function(){ setViewMode('day'); });
document.getElementById('segMonth').addEventListener('click', function(){ setViewMode('month'); });
function setViewMode(mode){
  viewMode = mode;
  document.getElementById('segDay').classList.toggle('active', mode==='day');
  document.getElementById('segMonth').classList.toggle('active', mode==='month');
  document.getElementById('dayField').style.display = mode==='day' ? 'block' : 'none';
  document.getElementById('monthField').style.display = mode==='month' ? 'block' : 'none';
  render();
}

var now = new Date();
document.getElementById('viewDayInput').valueAsDate = now;
document.getElementById('viewMonthInput').value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
document.getElementById('viewDayInput').addEventListener('change', render);
document.getElementById('viewMonthInput').addEventListener('change', render);

var thaiMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function monthLabel(key){
  var parts = key.split('-');
  return thaiMonths[parseInt(parts[1])-1] + ' ' + (parseInt(parts[0])+543);
}
function thaiDateLabel(iso){
  var parts = iso.split('-');
  return parseInt(parts[2]) + ' ' + thaiMonths[parseInt(parts[1])-1] + ' ' + (parseInt(parts[0])+543);
}

function render(){
  var data = getReturnsData();
  var rows, label;
  if(viewMode === 'day'){
    var d = document.getElementById('viewDayInput').value;
    rows = data.filter(function(r){ return r.date === d; });
    label = d ? thaiDateLabel(d) : '-';
  } else {
    var m = document.getElementById('viewMonthInput').value;
    rows = data.filter(function(r){ return r.date && r.date.slice(0,7) === m; });
    label = m ? monthLabel(m) : '-';
  }

  document.getElementById('orderHeroLabel').textContent = 'จำนวนออเดอร์ที่ตีกลับ — ' + label;
  var orders = new Set(rows.map(function(r){ return r.order; }).filter(Boolean));
  document.getElementById('orderHeroNum').textContent = orders.size.toLocaleString();

  var byProduct = {};
  rows.forEach(function(r){
    if(!byProduct[r.product]) byProduct[r.product] = {qty:0, orders:{}};
    byProduct[r.product].qty += (r.qty||0);
    if(r.order) byProduct[r.product].orders[r.order] = true;
  });
  var summaryRows = Object.keys(byProduct).map(function(p){
    return {product:p, qty:byProduct[p].qty, orders:Object.keys(byProduct[p].orders).length};
  });
  summaryRows.sort(function(a,b){ return b.qty-a.qty; });
  document.getElementById('summaryEmpty').style.display = summaryRows.length ? 'none' : 'block';
  document.getElementById('summaryBody').innerHTML = summaryRows.map(function(s){
    return '<tr><td>'+s.product+'</td><td>'+s.qty+'</td><td>'+s.orders+'</td></tr>';
  }).join('');
}
render();
</script>
</body>
</html>
